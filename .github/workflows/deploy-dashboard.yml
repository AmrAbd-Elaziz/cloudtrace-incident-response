name: Deploy CloudTrace Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "data/raw/**"
      - "detections/sigma/**"
      - "scripts/analyze_incident.py"
      - "scripts/generate_dashboard_data.py"
      - "scripts/validate_detections.py"
      - "requirements.txt"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Analyze CloudTrail incident
        run: python scripts/analyze_incident.py

      - name: Validate Sigma detections
        run: python scripts/validate_detections.py

      - name: Generate dashboard data
        run: |
          python scripts/generate_dashboard_data.py \
            --assessment-date 2026-09-09

      - name: Validate dashboard assets
        run: |
          python -m json.tool dashboard/data.json >/dev/null
          test -s dashboard/index.html
          test -s dashboard/styles.css
          test -s dashboard/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dashboard

  deploy:
    name: Deploy Dashboard
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5