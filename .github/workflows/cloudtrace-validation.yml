name: CloudTrace Validation Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  validate:
    name: Validate CloudTrace
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m py_compile \
            scripts/analyze_incident.py \
            scripts/validate_detections.py \
            scripts/generate_executive_report.py \
            scripts/generate_technical_report.py

      - name: Validate raw CloudTrail JSON
        run: |
          python -m json.tool \
            data/raw/cloudtrail-events.json \
            >/dev/null

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Analyze CloudTrail incident
        run: python scripts/analyze_incident.py

      - name: Validate Sigma detections
        run: python scripts/validate_detections.py

      - name: Generate executive incident report
        run: |
          python scripts/generate_executive_report.py \
            --assessment-date 2026-09-09

      - name: Generate technical incident report
        run: python scripts/generate_technical_report.py

      - name: Validate generated JSON evidence
        run: |
          python -m json.tool \
            data/processed/detection-findings.json \
            >/dev/null

          python -m json.tool \
            data/processed/indicators.json \
            >/dev/null

      - name: Validate expected evidence counts
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          with Path(
              "data/processed/incident-timeline.csv"
          ).open(
              newline="",
              encoding="utf-8",
          ) as file:
              timeline = list(csv.DictReader(file))

          with Path(
              "data/processed/detection-findings.json"
          ).open(encoding="utf-8") as file:
              findings = json.load(file)

          sigma_rules = list(
              Path("detections/sigma").glob("*.yml")
          )

          critical = sum(
              finding["severity"] == "Critical"
              for finding in findings
          )

          assert len(timeline) == 12, (
              f"Expected 12 timeline events, "
              f"found {len(timeline)}"
          )
          assert len(findings) == 11, (
              f"Expected 11 findings, "
              f"found {len(findings)}"
          )
          assert critical == 6, (
              f"Expected 6 critical findings, "
              f"found {critical}"
          )
          assert len(sigma_rules) == 3, (
              f"Expected 3 Sigma rules, "
              f"found {len(sigma_rules)}"
          )

          print("Evidence-count validation passed")
          print(f"Timeline events: {len(timeline)}")
          print(f"Detection findings: {len(findings)}")
          print(f"Critical findings: {critical}")
          print(f"Sigma rules: {len(sigma_rules)}")
          PY

      - name: Verify generated artifacts are current
        run: |
          git diff --exit-code -- \
            data/processed \
            reports/executive \
            reports/technical

      - name: Upload incident evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: cloudtrace-incident-evidence
          path: |
            data/raw/cloudtrail-events.json
            data/processed/incident-timeline.csv
            data/processed/detection-findings.json
            data/processed/indicators.json
            detections/sigma/
            docs/
            reports/executive/EXECUTIVE-INCIDENT-REPORT.md
            reports/technical/INCIDENT-ANALYSIS-REPORT.md
          if-no-files-found: error
          retention-days: 30